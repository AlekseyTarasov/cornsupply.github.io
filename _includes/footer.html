<!-- go up -->

<script>
$(document).ready(function () {

    $(window).scroll(function () {
        if ($(this).scrollTop() > 100) {
            $('.up').fadeIn();
        } else {
            $('.up').fadeOut();
        }
    });

    $('.up').click(function () {
        $("html, body").animate({
            scrollTop: 0
        }, 600);
        return false;
    });

});
</script>

<!-- gallery -->

<script>
(function () {
  var gallery = document.getElementById('scrolling-gallery');
  if (!gallery) return;
  gallery.style.scrollBehavior = 'auto';   // чтобы не мешал smooth из CSS

  // колесо
  gallery.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    var max = gallery.scrollWidth - gallery.clientWidth;
    if ((e.deltaY < 0 && gallery.scrollLeft <= 0) ||
        (e.deltaY > 0 && gallery.scrollLeft >= max - 1)) return;
    e.preventDefault();
    gallery.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 33 : 1);
  }, { passive: false });

  // перетаскивание мышью
  var down = false, dragging = false;
  var startX = 0, startLeft = 0, lastX = 0, lastT = 0, v = 0, glideId = 0;

  gallery.addEventListener('dragstart', function (e) { e.preventDefault(); });

  gallery.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    cancelAnimationFrame(glideId);
    down = true; dragging = false; v = 0;
    startX = lastX = e.clientX;
    startLeft = gallery.scrollLeft;
    lastT = performance.now();
  });

  window.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - startX;
    if (!dragging && Math.abs(dx) > 5) {
      dragging = true;
      gallery.classList.add('is-dragging');
      gallery.setPointerCapture(e.pointerId);
    }
    if (!dragging) return;
    gallery.scrollLeft = startLeft - dx;
    var now = performance.now();
    v = (lastX - e.clientX) / Math.max(1, now - lastT);   // px/ms
    lastX = e.clientX; lastT = now;
  });

  function end() {
    if (!down) return;
    down = false;
    if (!dragging) return;
    gallery.classList.remove('is-dragging');
    if (performance.now() - lastT > 80) v = 0;            // остановился перед отпусканием
    (function glide() {
      if (Math.abs(v) < 0.02) return;
      gallery.scrollLeft += v * 16;
      v *= 0.95;
      glideId = requestAnimationFrame(glide);
    })();
    setTimeout(function () { dragging = false; }, 0);     // после click
  }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  // после перетаскивания не открываем lightbox
  gallery.addEventListener('click', function (e) {
    if (dragging) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  // стрелки
  document.querySelectorAll('.arrow-right, .arrow-left').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var dir = btn.classList.contains('arrow-right') ? 1 : -1;
      gallery.scrollBy({ left: dir * 460, behavior: 'smooth' });
    });
  });
})();
</script>

<!-- popup menu -->
<script>
jQuery(document).ready(function($){
    //open popup

    $('.stickyanchor').on('click', function(event){
        event.preventDefault();
        $('.menu').addClass('is-visible');
        $('.stickyanchor').addClass('is-hide');
        $('body').addClass('overflow-hidden');
    });
    
    //close popup
    $('.menu').on('click', function(event){
        if( $(event.target).is('.close') || $(event.target).is('.menu') ) {
            event.preventDefault();
        $(this).removeClass('is-visible');
        $('.stickyanchor').removeClass('is-hide');
        $('body').removeClass('overflow-hidden');
        }
        });
        //close popup when clicking the esc keyboard button
        $(document).keyup(function(event) {
        if (event.which == '27') {
          $('.menu').removeClass('is-visible');
          $('.stickyanchor').removeClass('is-hide');
          $('body').removeClass('overflow-hidden');
        }
        });
        });
</script>

<script>
var createEyes = function (quantity) {
    var eyes = [];
    var eye;
    var lens;
    var i;
    quantity = (quantity | 0) || 2;
    for (i = 0; i < quantity; i++) {
        eye = document.getElementById("eyes");
        lens = document.getElementById("pupil");
        eye.appendChild(lens);
        document.getElementById("face").appendChild(eye);
        eyes.push({
            iris: eye,
            lens: lens
        });
    }
    return eyes;
}
var eyes = createEyes(2);
document.addEventListener("mousemove", function (event) {
    var x = event.pageX;
    var y = event.pageY;
    eyes.forEach(function (eye) {
        var offsets = eye.lens.getBoundingClientRect();
        var left = (offsets.left - x)
        var top = (offsets.top - y)
        var rad = Math.atan2(top, left);
        eye.iris.style.webkitTransform = "rotate(" + rad + "rad)";
    });
});
</script>

<!-- theme swither -->

<script>
	(function () {
	  var themeToggle = document.getElementById('theme-toggle');
	  var toggleButton = document.querySelector('.toggle-button');
	  if (!themeToggle || !toggleButton) return;
	
	  var root = document.documentElement;
	  toggleButton.checked = root.classList.contains('dark-theme');
	
	  themeToggle.addEventListener('click', function () {
	    var dark = root.classList.toggle('dark-theme');
	    toggleButton.checked = dark;
	    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
	  });
	})();
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {
  const links = document.querySelectorAll(".translation a");

  // Получаем текущий путь
  const currentPath = window.location.pathname;

  links.forEach((link) => {
    const linkPath = link.getAttribute("href");

    // Если путь начинается с "/ua", то активируем ссылку на UA
    if (currentPath.startsWith("/ua") && linkPath === "/ua") {
      link.classList.add("active");
    }
    // Если путь не начинается с "/ua", то активируем ссылку на EN
    else if (!currentPath.startsWith("/ua") && linkPath === "/") {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });
});
</script>

<!-- elipse.gif -->

<script>
(function () {
  var path = document.getElementById('blob-path');
  if (!path) return;

  var R0 = 144.76, CYCLES = 20, LOOP = 9;
  var W = 2 * Math.PI * CYCLES / LOOP;

  var H = [
    [2,   0.002,  0.466,  0.000, -0.261],
    [3,   0.051, -0.009,  0.088,  0.005],
    [4,  -0.005, -0.869, -0.011,  0.491],
    [5,  -0.818,  0.003, -1.448, -0.001],
    [6,  -0.008, -1.419, -0.013,  0.800],
    [7,  -0.555,  0.003, -0.982, -0.001],
    [8,  -0.006, -0.558, -0.012,  0.314],
    [9,  -0.148, -0.010, -0.260,  0.005],
    [10, -0.008, -0.097, -0.014,  0.054]
  ];

  var N = 180, TAU = 2 * Math.PI;
  var cosT = [], sinT = [], CK = [], SK = [];
  for (var i = 0; i < N; i++) {
    var th = i / N * TAU;
    cosT.push(Math.cos(th)); sinT.push(Math.sin(th));
  }
  H.forEach(function (h) {
    CK.push(cosT.map(function (_, i) { return Math.cos(h[0] * i / N * TAU); }));
    SK.push(cosT.map(function (_, i) { return Math.sin(h[0] * i / N * TAU); }));
  });

  function draw(t) {
    var cw = Math.cos(W * t), sw = Math.sin(W * t), d = '';
    for (var i = 0; i < N; i++) {
      var r = R0;
      for (var j = 0; j < H.length; j++) {
        var h = H[j];
        r += (h[1] * CK[j][i] + h[2] * SK[j][i]) * cw
           + (h[3] * CK[j][i] + h[4] * SK[j][i]) * sw;
      }
      d += (i ? 'L' : 'M') + (r * cosT[i]).toFixed(2) + ' ' + (r * sinT[i]).toFixed(2);
    }
    path.setAttribute('d', d + 'Z');
  }

  draw(0);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var start = performance.now(), raf = 0;
  function tick(now) {
    draw((now - start) / 1000);
    raf = requestAnimationFrame(tick);
  }
  // анимируем, только когда логотип реально виден
  new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) { if (!raf) raf = requestAnimationFrame(tick); }
    else { cancelAnimationFrame(raf); raf = 0; }
  }).observe(path.ownerSVGElement);
})();
</script>
