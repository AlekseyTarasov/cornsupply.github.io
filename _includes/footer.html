<!-- go up -->

<script>
$(document).ready(function () {

    $(window).scroll(function () {
        if ($(this).scrollTop() > 100) {
            $('.up').fadeIn();
        } else {
            $('.up').fadeOut();
        }
    });

    $('.up').click(function () {
        $("html, body").animate({
            scrollTop: 0
        }, 600);
        return false;
    });

});
</script>

<!-- popup menu -->
<script>
jQuery(document).ready(function($){
    //open popup

    $('.stickyanchor').on('click', function(event){
        event.preventDefault();
        $('.menu').addClass('is-visible');
        $('.stickyanchor').addClass('is-hide');
        $('body').addClass('overflow-hidden');
    });
    
    //close popup
    $('.menu').on('click', function(event){
        if( $(event.target).is('.close') || $(event.target).is('.menu') ) {
            event.preventDefault();
        $(this).removeClass('is-visible');
        $('.stickyanchor').removeClass('is-hide');
        $('body').removeClass('overflow-hidden');
        }
        });
        //close popup when clicking the esc keyboard button
        $(document).keyup(function(event) {
        if (event.which == '27') {
          $('.menu').removeClass('is-visible');
          $('.stickyanchor').removeClass('is-hide');
          $('body').removeClass('overflow-hidden');
        }
        });
        });
</script>

<script>
var createEyes = function (quantity) {
    var eyes = [];
    var eye;
    var lens;
    var i;
    quantity = (quantity | 0) || 2;
    for (i = 0; i < quantity; i++) {
        eye = document.getElementById("eyes");
        lens = document.getElementById("pupil");
        eye.appendChild(lens);
        document.getElementById("face").appendChild(eye);
        eyes.push({
            iris: eye,
            lens: lens
        });
    }
    return eyes;
}
var eyes = createEyes(2);
document.addEventListener("mousemove", function (event) {
    var x = event.pageX;
    var y = event.pageY;
    eyes.forEach(function (eye) {
        var offsets = eye.lens.getBoundingClientRect();
        var left = (offsets.left - x)
        var top = (offsets.top - y)
        var rad = Math.atan2(top, left);
        eye.iris.style.webkitTransform = "rotate(" + rad + "rad)";
    });
});
</script>

<!-- theme swither -->

<script>
    const themeToggle = document.getElementById("theme-toggle");
    const toggleButton = document.querySelector(".toggle-button");
    const body = document.body;

    // Проверяем сохранённую тему и устанавливаем её
    if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark-theme");
        toggleButton.checked = true; // Устанавливаем чекбокс в "включённое" состояние
    } else {
        toggleButton.checked = false; // Чекбокс выключен, если тема светлая
    }

    // Обработчик клика по переключателю
    themeToggle.addEventListener("click", () => {
        body.classList.toggle("dark-theme");

        if (body.classList.contains("dark-theme")) {
            localStorage.setItem("theme", "dark");
            toggleButton.checked = true;
        } else {
            localStorage.setItem("theme", "light");
            toggleButton.checked = false;
        }
    });
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {
  const links = document.querySelectorAll(".translation a");

  // Получаем текущий путь
  const currentPath = window.location.pathname;

  links.forEach((link) => {
    const linkPath = link.getAttribute("href");

    // Если путь начинается с "/ua", то активируем ссылку на UA
    if (currentPath.startsWith("/ua") && linkPath === "/ua") {
      link.classList.add("active");
    }
    // Если путь не начинается с "/ua", то активируем ссылку на EN
    else if (!currentPath.startsWith("/ua") && linkPath === "/") {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });
});

</script>

<script>
(() => {
  // Параметры получены анализом кадров elipse.gif (302 кадра по 30 мс, цикл 300 кадров = 9 с).
  const R0 = 144.76;               // средний радиус в исходнике (500x500)
  const CYCLES = 20;               // 20 пульсаций за цикл 9 с -> период 0.45 с
  const LOOP = 9;                  // секунды
  const W = 2 * Math.PI * CYCLES / LOOP;

  // r(θ,t) = R0 + Σ (a·cos kθ + b·sin kθ)·cos ωt + (c·cos kθ + d·sin kθ)·sin ωt
  //  k     a       b       c       d
  const H = [
    [2,   0.002,  0.466,  0.000, -0.261],
    [3,   0.051, -0.009,  0.088,  0.005],
    [4,  -0.005, -0.869, -0.011,  0.491],
    [5,  -0.818,  0.003, -1.448, -0.001],
    [6,  -0.008, -1.419, -0.013,  0.800],
    [7,  -0.555,  0.003, -0.982, -0.001],
    [8,  -0.006, -0.558, -0.012,  0.314],
    [9,  -0.148, -0.010, -0.260,  0.005],
    [10, -0.008, -0.097, -0.014,  0.054]
  ];

  const N = 180;                   // точек контура
  const path = document.getElementById('blob-path');
  const cosT = new Float32Array(N), sinT = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const th = i / N * 2 * Math.PI;
    cosT[i] = Math.cos(th); sinT[i] = Math.sin(th);
  }
  // предвычисленные cos(kθ), sin(kθ)
  const CK = H.map(h => Array.from({length: N}, (_, i) => Math.cos(h[0] * i / N * 2 * Math.PI)));
  const SK = H.map(h => Array.from({length: N}, (_, i) => Math.sin(h[0] * i / N * 2 * Math.PI)));

  function draw(t) {
    const cw = Math.cos(W * t), sw = Math.sin(W * t);
    let d = '';
    for (let i = 0; i < N; i++) {
      let r = R0;
      for (let j = 0; j < H.length; j++) {
        const h = H[j];
        r += (h[1] * CK[j][i] + h[2] * SK[j][i]) * cw
           + (h[3] * CK[j][i] + h[4] * SK[j][i]) * sw;
      }
      d += (i ? 'L' : 'M') + (r * cosT[i]).toFixed(2) + ' ' + (r * sinT[i]).toFixed(2);
    }
    path.setAttribute('d', d + 'Z');
  }

  draw(0);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const start = performance.now();
  (function tick(now) {
    draw((now - start) / 1000);
    requestAnimationFrame(tick);
  })(start);
})();
</script>
